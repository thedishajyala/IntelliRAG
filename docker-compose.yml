version: '3.8'

services:
  rag-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-rag-system
    ports:
      - "5001:5001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      # Mount persistent volumes for index caching and uploaded documents
      - rag_cache:/tmp/cache
      - rag_docs:/tmp/docs
    restart: unless-stopped

volumes:
  rag_cache:
    driver: local
  rag_docs:
    driver: local
